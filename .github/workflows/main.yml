name: Build Y2Kmeter (Multi-Platform)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== Linux 依赖安装 ==========
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev \
            libfreetype6-dev libwebkit2gtk-4.0-dev libglu1-mesa-dev libcurl4-gnutls-dev

      # ========== macOS 环境准备 ==========
      - name: Setup macOS environment
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # ========== CMake 配置 ==========
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_INSTALL_PREFIX=install

      # ========== 编译 ==========
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel $(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)

      # ========== 打包产物 (分平台) ==========
      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifactDir = "build/Y2Kmeter_artefacts/${{ env.BUILD_TYPE }}"
          if (Test-Path "$artifactDir/VST3") { Compress-Archive -Path "$artifactDir/VST3/*" -DestinationPath Y2Kmeter_VST3_Windows.zip }
          if (Test-Path "$artifactDir/Standalone") { Compress-Archive -Path "$artifactDir/Standalone/*" -DestinationPath Y2Kmeter_Standalone_Windows.zip }

      - name: Package macOS artifacts
        if: runner.os == 'macOS'
        run: |
          cd build/Y2Kmeter_artefacts/${{ env.BUILD_TYPE }}
          [ -d "VST3" ] && zip -r $GITHUB_WORKSPACE/Y2Kmeter_VST3_macOS.zip VST3
          [ -d "AU" ] && zip -r $GITHUB_WORKSPACE/Y2Kmeter_AU_macOS.zip AU
          [ -d "Standalone" ] && zip -r $GITHUB_WORKSPACE/Y2Kmeter_Standalone_macOS.zip Standalone

      - name: Package Linux artifacts
        if: runner.os == 'Linux'
        run: |
          cd build/Y2Kmeter_artefacts/${{ env.BUILD_TYPE }}
          [ -d "VST3" ] && zip -r $GITHUB_WORKSPACE/Y2Kmeter_VST3_Linux.zip VST3
          [ -d "Standalone" ] && zip -r $GITHUB_WORKSPACE/Y2Kmeter_Standalone_Linux.zip Standalone

      # ========== 上传构建结果 ==========
      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Y2Kmeter_Windows
          path: |
            Y2Kmeter_VST3_Windows.zip
            Y2Kmeter_Standalone_Windows.zip

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Y2Kmeter_macOS
          path: |
            Y2Kmeter_VST3_macOS.zip
            Y2Kmeter_AU_macOS.zip
            Y2Kmeter_Standalone_macOS.zip

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Y2Kmeter_Linux
          path: |
            Y2Kmeter_VST3_Linux.zip
            Y2Kmeter_Standalone_Linux.zip
